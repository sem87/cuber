services:
  wallett-bot:
    # 🔄 Автоматически тянем последний образ из репозитория
    image: sem87sem/wallett:latest
    # 🔄 Или собираем локально (раскомментировать, если нужно)
    # build: .
    container_name: wallett-sem
    # 🔄 Автоперезапуск при падении
    restart: unless-stopped
    # Варианты: no | on-failure | always | unless-stopped
    # 🔒 Монтируем секретные файлы из хоста в контейнер
    volumes:
      # Файлы с секретами (только чтение для безопасности)
      - ./.env.wallet:/app/.env.wallet:ro
      - ./credentials.json:/app/credentials.json:ro
      - ./token.pickle:/app/token.pickle
      # Логи (чтобы не терялись при перезапуске)
      - ./logs:/app/logs
      # Кэш и временные данные
      - ./data:/app/data
      # 🗄️ БАЗА ДАННЫХ — добавляем эту строку:
      - ../terminator:/terminator  # ← Ключевая строка!

    # 🔐 Переменные окружения (можно продублировать из .env.wallet)
    environment:
      - PYTHONPATH=/app
      # - TOKEN=${TOKEN}  # Если нужно передать из .env
    # 🌐 Сетевые настройки
    network_mode: bridge
    # 📊 Ресурсы (опционально)
#    deploy:
#      resources:
#        limits:
#          cpus: '1.0'
#          memory: 512M
#        reservations:
#          cpus: '0.25'
#          memory: 128M
    # 🔍 Логирование
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # 🏥 Health check (проверка живости)
    healthcheck:
      test: ["CMD", "python", "-c", "print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s







